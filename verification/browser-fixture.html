<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="_csrf" content="probe-token"><meta name="_csrf_header" content="X-CSRF-TOKEN"><link rel="stylesheet" href="/platform/css/common.css"><link rel="stylesheet" href="/playpit/css/uka.css"><script defer src="/platform/js/common.js"></script><script defer src="/playpit/js/uka.js"></script><script defer src="/playpit/js/message.js"></script></head><body><header class="global-header">
<a aria-label="CreVe トップ" class="brand">CreVe</a>
<button aria-controls="globalMenu" aria-expanded="false" id="globalMenuButton" type="button">メニュー</button>
<nav aria-label="サイト内ナビゲーション" id="globalMenu">
<a>CreVeについて</a>

<a>VR構想</a><a>お知らせ</a><a>お問い合わせ</a>
</nav>
</header>
<main id="mainContent"><h1>作品詳細・修正版の部品検証</h1><section class="message-section">
<h2>感想を届ける</h2>

<form data-enabled="true" id="messageForm" novalidate="">
<input id="eventId" name="eventId" type="hidden" value="1"/>
<input id="creatorId" name="creatorId" type="hidden" value="2"/>
<input id="artworkId" name="artworkId" type="hidden" value="3"/>
<label for="messageText">感想・メッセージ（必須・300文字以内）</label><textarea aria-describedby="messageCount messageError" id="messageText" maxlength="300" name="message" required=""></textarea>
<p><span id="messageCount">0</span> / 300文字</p>
<label for="displayName">表示名（任意・30文字以内）</label><input autocomplete="nickname" id="displayName" maxlength="30" name="displayName"/>
<label class="checkbox"><input checked="" id="anonymousFlag" name="anonymous" type="checkbox"/>匿名で投稿する</label>
<label class="checkbox"><input id="agreementFlag" name="agreement" required="" type="checkbox"/><a rel="noopener" target="_blank">利用規約</a>と<a rel="noopener" target="_blank">プライバシーポリシー</a>を確認し、同意する</label>
<div class="error" id="messageError" role="alert"></div><p aria-live="polite" id="messageSuccess" role="status"></p>
<button id="submitMessageButton" type="submit">言葉を花びらにする</button>
</form>
</section>
<section class="uka-section">
<div class="section-title"><h2>羽花</h2><p><span data-message-count="">0</span>枚の言葉</p></div>
<p class="uka-stage-description" data-growth-label=""></p>
<div aria-label="言葉で育つ羽花" class="uka-board" data-artwork-id="3" data-creator-id="2" data-event-id="1" data-growth-stage="0" data-uka-board="" role="group">
<div aria-hidden="true" class="uka-silhouette"></div>
<p class="uka-empty" data-uka-empty="">最初の言葉を待っています。</p>
<div class="uka-petals" data-uka-petals="">

</div>
</div>
<p data-representative-note="">花びらは最大300件を代表表示しています。総投稿数は別に表示しています。</p>
<a>イベント全体の羽花を見る</a>
<dialog aria-labelledby="messageModalTitle" id="messageModal">
<h2 id="messageModalTitle">花びらに届いた言葉</h2><p class="preserve-lines" id="modalMessage"></p>
<dl><dt>表示名</dt><dd id="modalDisplayName"></dd><dt>投稿日</dt><dd id="modalCreatedAt"></dd><dt>作品名</dt><dd id="modalArtworkTitle"></dd><dt>クリエイター</dt><dd id="modalCreatorName"></dd></dl>
<details><summary>この投稿を通報する</summary><form id="reportForm"><label for="reportReason">通報理由</label><textarea id="reportReason" maxlength="300" required=""></textarea><button type="submit">運営に報告する</button><p id="reportResult" role="status"></p></form></details>
<button id="closeMessageModalButton" type="button">閉じる</button>
</dialog>
</section>
<section class="words-section" data-words-page="0">
<h2>届いた言葉</h2><p>花びらを操作せず、一覧でも感想を読むことができます。</p>
<div data-words-list=""></div>
<p data-words-empty="">まだ感想はありません。</p>
<nav aria-label="感想のページ" class="pagination" data-words-pagination=""></nav>
</section>
</main></body></html>
