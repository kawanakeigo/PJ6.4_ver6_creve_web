spring.application.name=creve-web
spring.thymeleaf.cache=false

server.port=8080

spring.datasource.url=${CREVE_DATASOURCE_URL:jdbc:h2:mem:creve;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${CREVE_DATASOURCE_USERNAME:sa}
spring.datasource.password=${CREVE_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${CREVE_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

creve.admin.email=${CREVE_ADMIN_EMAIL:admin@creve.world}
creve.admin.password=${CREVE_ADMIN_PASSWORD:playpit-admin}
creve.session.hash-salt=${CREVE_SESSION_HASH_SALT:creve-local-salt}
