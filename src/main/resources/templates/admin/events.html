<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('イベント管理')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Admin</p>
    <h1>イベント管理</h1>
    <p>PLAYPITとLiveのイベント基本情報を確認できます。</p>
  </section>
  <section class="admin-table">
    <table>
      <thead>
      <tr><th>ID</th><th>種別</th><th>状態</th><th>名称</th><th>日程</th><th>投稿可否</th></tr>
      </thead>
      <tbody>
      <tr th:each="event : ${events}">
        <td th:text="${event.id}">id</td>
        <td th:text="${event.eventType}">PLAYPIT</td>
        <td th:text="${event.status}">PUBLISHED</td>
        <td th:text="${event.name}">name</td>
        <td th:text="${event.scheduleText}">schedule</td>
        <td th:text="${event.postable} ? '可' : '不可'">可</td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
