<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('投稿詳細')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Admin</p>
    <h1>投稿詳細</h1>
    <p th:text="'ID: ' + ${message.id}">ID</p>
  </section>
  <section class="admin-detail">
    <dl class="definition-list">
      <div><dt>イベント</dt><dd th:text="${message.eventId}">event</dd></div>
      <div><dt>クリエイター</dt><dd th:text="${message.creatorId}">creator</dd></div>
      <div><dt>作品</dt><dd th:text="${message.artworkId}">artwork</dd></div>
      <div><dt>投稿者</dt><dd th:text="${message.displayName}">匿名</dd></div>
      <div><dt>状態</dt><dd th:text="${message.status}">PUBLISHED</dd></div>
      <div><dt>本文</dt><dd th:text="${message.body}">body</dd></div>
    </dl>
    <div class="admin-actions">
      <form method="post" th:action="@{/admin/messages/{messageId}/publish(messageId=${message.id})}">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">公開</button>
      </form>
      <form method="post" th:action="@{/admin/messages/{messageId}/hide(messageId=${message.id})}">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">非公開</button>
      </form>
      <form method="post" th:action="@{/admin/messages/{messageId}/delete(messageId=${message.id})}">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="danger" type="submit">削除</button>
      </form>
      <a class="button" th:href="@{/admin/messages}">一覧へ戻る</a>
    </div>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
