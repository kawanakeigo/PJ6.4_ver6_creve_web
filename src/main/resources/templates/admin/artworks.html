<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('作品管理')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Admin</p>
    <h1>作品管理</h1>
    <p>作品のイベント紐づけ、制作者、表示順を確認できます。</p>
  </section>
  <section class="admin-table">
    <table>
      <thead>
      <tr><th>ID</th><th>イベント</th><th>クリエイター</th><th>状態</th><th>作品名</th><th>表示順</th></tr>
      </thead>
      <tbody>
      <tr th:each="artwork : ${artworks}">
        <td th:text="${artwork.id}">id</td>
        <td th:text="${artwork.eventId}">event</td>
        <td th:text="${artwork.creatorId}">creator</td>
        <td th:text="${artwork.status}">PUBLISHED</td>
        <td th:text="${artwork.title}">title</td>
        <td th:text="${artwork.displayOrder}">1</td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
