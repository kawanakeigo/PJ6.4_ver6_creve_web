<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('投稿管理')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Admin</p>
    <h1>投稿管理</h1>
    <p>投稿内容の検索、公開・非公開の切り替え、削除扱いへの変更を行えます。</p>
  </section>

  <section class="admin-tools">
    <form class="admin-filter" method="get" th:action="@{/admin/messages}">
      <label>
        イベントID
        <input type="search" name="eventId" th:value="${eventId}" placeholder="202606-uka">
      </label>
      <label>
        クリエイターID
        <input type="search" name="creatorId" th:value="${creatorId}" placeholder="creator-001">
      </label>
      <label>
        作品ID
        <input type="search" name="artworkId" th:value="${artworkId}" placeholder="artwork-001-1">
      </label>
      <label>
        状態
        <select name="status">
          <option value="">すべて</option>
          <option th:each="statusOption : ${statuses}" th:value="${statusOption}" th:text="${statusOption}" th:selected="${statusOption == selectedStatus}">PUBLISHED</option>
        </select>
      </label>
      <label>
        キーワード
        <input type="search" name="keyword" th:value="${keyword}" placeholder="本文・投稿者名">
      </label>
      <button class="button primary" type="submit">絞り込む</button>
    </form>
    <div class="admin-subnav">
      <a th:href="@{/admin/events}">イベント</a>
      <a th:href="@{/admin/creators}">クリエイター</a>
      <a th:href="@{/admin/artworks}">作品</a>
      <form method="post" th:action="@{/admin/logout}">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="button" type="submit">ログアウト</button>
      </form>
    </div>
  </section>

  <p class="admin-notice" th:if="${notice}" th:text="${notice}">保存しました。</p>

  <section class="admin-table">
    <table>
      <thead>
      <tr><th>ID</th><th>イベント</th><th>クリエイター</th><th>作品</th><th>投稿者</th><th>本文</th><th>状態</th><th>操作</th></tr>
      </thead>
      <tbody>
      <tr th:each="message : ${messages}">
        <td><a th:href="@{/admin/messages/{messageId}(messageId=${message.id})}" th:text="${message.id}">1</a></td>
        <td th:text="${message.eventId}">event</td>
        <td th:text="${message.creatorId}">creator</td>
        <td th:text="${message.artworkId}">artwork</td>
        <td th:text="${message.displayName}">匿名</td>
        <td th:text="${message.body}">body</td>
        <td th:text="${message.status}">PUBLISHED</td>
        <td>
          <div class="admin-actions">
            <form th:if="${message.status.name() != 'PUBLISHED'}" method="post" th:action="@{/admin/messages/{messageId}/publish(messageId=${message.id})}">
              <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit">公開</button>
            </form>
            <form th:if="${message.status.name() == 'PUBLISHED'}" method="post" th:action="@{/admin/messages/{messageId}/hide(messageId=${message.id})}">
              <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit">非公開</button>
            </form>
            <form th:if="${message.status.name() != 'DELETED'}" method="post" th:action="@{/admin/messages/{messageId}/delete(messageId=${message.id})}">
              <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="danger" type="submit">削除</button>
            </form>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(messages)}">
        <td colspan="8">条件に一致する投稿はありません。</td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
