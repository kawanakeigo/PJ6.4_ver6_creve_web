<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('クリエイター管理')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Admin</p>
    <h1>クリエイター管理</h1>
    <p>公開状態、表示順、プロフィール情報を確認できます。</p>
  </section>
  <section class="admin-table">
    <table>
      <thead>
      <tr><th>ID</th><th>状態</th><th>表示順</th><th>名前</th><th>ジャンル</th><th>SNS</th></tr>
      </thead>
      <tbody>
      <tr th:each="creator : ${creators}">
        <td th:text="${creator.id}">id</td>
        <td th:text="${creator.status}">PUBLISHED</td>
        <td th:text="${creator.displayOrder}">1</td>
        <td th:text="${creator.name}">name</td>
        <td th:text="${creator.category}">category</td>
        <td th:text="${creator.instagram}">instagram</td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
