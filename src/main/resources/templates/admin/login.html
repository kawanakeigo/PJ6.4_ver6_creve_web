<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('管理者ログイン')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Admin</p>
    <h1>管理者ログイン</h1>
    <p>PLAYPITの投稿管理画面に入ります。</p>
  </section>

  <section class="admin-auth">
    <form class="admin-card" method="post" th:action="@{/admin/login}">
      <p class="form-error" th:if="${param.error}">メールアドレスまたはパスワードが違います。</p>
      <p class="admin-notice" th:if="${param.logout}">ログアウトしました。</p>
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>
        メールアドレス
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>
        パスワード
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="button primary" type="submit">ログイン</button>
    </form>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
