<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('PLAYPITイベント一覧')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">PLAYPIT Events</p>
    <h1>イベント一覧</h1>
    <p>PLAYPITで開催される展示イベントを掲載します。</p>
  </section>
  <section class="list-layout">
    <a class="event-row" th:each="event : ${events}" th:href="@{/playpit/{eventId}(eventId=${event.slug})}">
      <span th:text="${event.scheduleText}">2026年6月</span>
      <strong th:text="${event.name}">羽花展</strong>
      <em th:text="${event.subtitle}">subtitle</em>
    </a>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
