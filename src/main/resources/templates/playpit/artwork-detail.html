<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(${artwork.title})}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="detail-hero">
    <img class="main-visual" th:src="@{${artwork.imageUrl}}" th:alt="${artwork.title}">
    <div>
      <p class="eyebrow">Artwork</p>
      <h1 th:text="${artwork.title}">artwork</h1>
      <p class="lead" th:text="${artwork.description}">description</p>
      <dl class="definition-list">
        <div><dt>制作者</dt><dd><a th:href="@{/playpit/{eventId}/creators/{creatorId}(eventId=${event.slug}, creatorId=${creator.slug})}" th:text="${creator.name}">creator</a></dd></div>
        <div><dt>制作背景</dt><dd th:text="${artwork.background}">background</dd></div>
        <div><dt>展示意図</dt><dd th:text="${artwork.intention}">intention</dd></div>
        <div><dt>素材・技法</dt><dd th:text="${artwork.technique}">technique</dd></div>
        <div><dt>制作年</dt><dd th:text="${artwork.productionYear}">year</dd></div>
      </dl>
    </div>
  </section>
  <section class="uka-section">
    <div>
      <p class="eyebrow">Message</p>
      <h2>この作品への感想を残す</h2>
      <form class="message-form" data-message-form th:data-event-id="${event.id}" th:data-creator-id="${creator.id}" th:data-artwork-id="${artwork.id}">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          <span>メッセージ</span>
          <textarea name="body" maxlength="300" required placeholder="作品を見て残したい言葉"></textarea>
        </label>
        <div class="form-row">
          <input name="displayName" maxlength="30" placeholder="名前（任意）">
          <button type="submit">花びらを投稿</button>
        </div>
        <label class="check-row">
          <input type="checkbox" name="anonymous" checked>
          <span>匿名で表示する</span>
        </label>
        <label class="check-row">
          <input type="checkbox" name="termsAgreed" required>
          <span>投稿内容を確認しました</span>
        </label>
        <p class="form-help"><span data-count>0</span>/300</p>
        <p class="form-message" data-form-message></p>
      </form>
    </div>
    <div class="message-list" data-message-list>
      <p class="list-count"><span th:text="${messageCount}">0</span>件のメッセージ</p>
      <article th:each="message : ${messages}">
        <p th:text="${message.body}">message</p>
        <small th:text="${message.displayName}">匿名</small>
      </article>
    </div>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/message.js}"></script>
</body>
</html>
