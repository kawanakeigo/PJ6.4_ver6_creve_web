<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(${event.name})}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="hero event-hero">
    <p class="eyebrow">PLAYPIT Event</p>
    <h1 th:text="${event.name}">羽花展</h1>
    <p class="lead" th:text="${event.subtitle}">subtitle</p>
    <img class="hero-image" th:src="@{${event.mainImageUrl}}" th:alt="${event.name}">
    <div class="meta-grid">
      <div><span>日程</span><strong th:text="${event.scheduleText}">2026年6月</strong></div>
      <div><span>場所</span><strong th:text="${event.venueText}">Coming Soon</strong></div>
      <div><span>投稿数</span><strong th:text="${messageCount} + '件'">0件</strong></div>
    </div>
    <div class="actions">
      <a class="button primary" th:href="@{/playpit/{eventId}/creators(eventId=${event.slug})}">参加クリエイター</a>
      <a class="button" th:href="@{/playpit/{eventId}/artworks(eventId=${event.slug})}">作品一覧</a>
      <a class="button" th:href="@{/playpit/{eventId}/uka(eventId=${event.slug})}">イベント全体の羽花</a>
    </div>
  </section>
  <section class="section-title">
    <p class="eyebrow">Overview</p>
    <h2>イベント詳細</h2>
    <p th:text="${event.description}">description</p>
  </section>
  <section class="creator-grid">
    <a class="creator-card" th:each="creator : ${creators}" th:href="@{/playpit/{eventId}/creators/{creatorId}(eventId=${event.slug}, creatorId=${creator.slug})}">
      <img th:src="@{${creator.imageUrl}}" th:alt="${creator.name}">
      <div>
        <img class="avatar" th:src="@{${creator.iconImageUrl}}" alt="">
        <h3 th:text="${creator.name}">name</h3>
        <p th:text="${creator.category}">category</p>
      </div>
    </a>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
