<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('イベント全体の羽花')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Uka</p>
    <h1>イベント全体の羽花</h1>
    <p><span th:text="${event.name}">羽花展</span> に集まった言葉が、一つの大きな羽へ育っていきます。</p>
  </section>
  <section class="uka-page">
    <div class="uka-board large" data-uka-board>
      <button class="petal" type="button" th:each="message : ${messages}"
              th:data-body="${message.body}"
              th:data-display-name="${message.displayName}"
              th:style="'--x:' + ${message.petalX} + '%;--y:' + ${message.petalY} + '%;--angle:' + ${message.petalAngle} + 'deg;--scale:' + ${message.petalSize}">
        <span th:text="${message.body}">message</span>
      </button>
      <div class="uka-count"><span th:text="${messageCount}">0</span> petals</div>
    </div>
    <aside class="panel">
      <span>Total</span>
      <strong th:text="${messageCount} + '件の言葉'">0件</strong>
      <p>参加クリエイターごとの羽花、作品ごとの言葉へ移動できます。</p>
      <a class="button" th:href="@{/playpit/{eventId}/creators(eventId=${event.slug})}">クリエイター別に見る</a>
    </aside>
  </section>
</main>
<dialog class="message-dialog" data-message-dialog>
  <p data-dialog-body></p>
  <small data-dialog-meta></small>
  <button type="button" data-dialog-close>閉じる</button>
</dialog>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/uka.js}"></script>
</body>
</html>
