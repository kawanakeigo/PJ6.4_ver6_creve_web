<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('PLAYPIT')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="hero playpit-hero">
    <p class="eyebrow">PLAYPIT</p>
    <h1>PLAYPIT</h1>
    <p class="lead">まだ言葉にならない表現が、ここで遊びはじめる。作品・人・来場者の言葉を、羽花として残す展示体験です。</p>
    <div class="actions">
      <a class="button primary" th:href="@{/playpit/events}">イベント一覧</a>
      <a class="button" th:href="@{/playpit/{eventId}(eventId=${featuredEvent.slug})}">羽花展を見る</a>
    </div>
  </section>
  <section class="featured-event" th:if="${featuredEvent}">
    <img th:src="@{${featuredEvent.mainImageUrl}}" th:alt="${featuredEvent.name}">
    <div>
      <p class="eyebrow">Current Event</p>
      <h2 th:text="${featuredEvent.name}">羽花展</h2>
      <p th:text="${featuredEvent.summary}">summary</p>
      <a class="button primary" th:href="@{/playpit/{eventId}(eventId=${featuredEvent.slug})}">詳細を見る</a>
    </div>
  </section>
  <section class="section-grid">
    <article class="panel">
      <span>Concept</span>
      <strong>展示を見るだけでなく、言葉を残して作品へ参加する。</strong>
    </article>
    <article class="panel">
      <span>Creators</span>
      <strong>参加クリエイターのプロフィール、作品、SNSを集約する。</strong>
    </article>
    <article class="panel">
      <span>Uka</span>
      <strong>感想が一枚の花びらとなり、大きな羽へ育っていく。</strong>
    </article>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
