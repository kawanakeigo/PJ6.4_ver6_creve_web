<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(${creator.name})}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="detail-hero">
    <img class="main-visual" th:src="@{${creator.imageUrl}}" th:alt="${creator.name}">
    <div>
      <p class="eyebrow" th:text="${creator.category}">category</p>
      <h1 th:text="${creator.name}">creator</h1>
      <p class="artist" th:if="${creator.artistName}" th:text="'@' + ${creator.artistName}">@artist</p>
      <img class="avatar large" th:src="@{${creator.iconImageUrl}}" alt="">
      <p class="lead" th:text="${creator.profile}">profile</p>
      <div class="link-list">
        <a th:if="${creator.instagram}" th:href="${creator.instagram}" target="_blank" rel="noreferrer">Instagram</a>
        <a th:if="${creator.x}" th:href="${creator.x}" target="_blank" rel="noreferrer">X</a>
        <a th:if="${creator.website}" th:href="${creator.website}" target="_blank" rel="noreferrer">Website</a>
      </div>
    </div>
  </section>
  <section class="section-title">
    <p class="eyebrow">Theme</p>
    <h2 th:text="${creator.concept}">concept</h2>
  </section>
  <section class="section-title">
    <p class="eyebrow">Artworks</p>
    <h2>出展作品</h2>
  </section>
  <section class="artwork-grid">
    <a class="artwork-card" th:each="artwork : ${artworks}" th:href="@{/playpit/{eventId}/artworks/{artworkId}(eventId=${event.slug}, artworkId=${artwork.slug})}">
      <img th:src="@{${artwork.imageUrl}}" th:alt="${artwork.title}">
      <h3 th:text="${artwork.title}">title</h3>
      <p th:text="${artwork.description}">description</p>
    </a>
  </section>
  <section class="uka-section">
    <div>
      <p class="eyebrow">Uka</p>
      <h2>言葉が集まるほど、花びらは羽へ変わっていく。</h2>
      <p>来場者が会場で感じたこと、心に残ったこと、クリエイターへ届けたい言葉を投稿できます。</p>
      <form class="message-form" data-message-form th:data-event-id="${event.id}" th:data-creator-id="${creator.id}">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
          <span>メッセージ</span>
          <textarea name="body" maxlength="300" required placeholder="作品を見て残したい言葉"></textarea>
        </label>
        <div class="form-row">
          <input name="displayName" maxlength="30" placeholder="名前（任意）">
          <button type="submit">花びらを投稿</button>
        </div>
        <label class="check-row">
          <input type="checkbox" name="anonymous" checked>
          <span>匿名で表示する</span>
        </label>
        <label class="check-row">
          <input type="checkbox" name="termsAgreed" required>
          <span>投稿内容を確認しました</span>
        </label>
        <p class="form-help"><span data-count>0</span>/300</p>
        <p class="form-message" data-form-message></p>
      </form>
    </div>
    <div class="uka-board" data-uka-board>
      <button class="petal" type="button" th:each="message : ${messages}"
              th:data-body="${message.body}"
              th:data-display-name="${message.displayName}"
              th:style="'--x:' + ${message.petalX} + '%;--y:' + ${message.petalY} + '%;--angle:' + ${message.petalAngle} + 'deg;--scale:' + ${message.petalSize}">
        <span th:text="${message.body}">message</span>
      </button>
      <div class="uka-count"><span data-message-count th:text="${messageCount}">0</span> petals</div>
    </div>
  </section>
</main>
<dialog class="message-dialog" data-message-dialog>
  <p data-dialog-body></p>
  <small data-dialog-meta></small>
  <button type="button" data-dialog-close>閉じる</button>
</dialog>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/message.js}"></script>
</body>
</html>
