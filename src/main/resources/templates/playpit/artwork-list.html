<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('作品一覧')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Artworks</p>
    <h1>展示作品一覧</h1>
    <p th:text="${event.name}">event</p>
  </section>
  <section class="artwork-grid">
    <a class="artwork-card" th:each="artwork : ${artworks}" th:href="@{/playpit/{eventId}/artworks/{artworkId}(eventId=${event.slug}, artworkId=${artwork.slug})}">
      <img th:src="@{${artwork.imageUrl}}" th:alt="${artwork.title}">
      <h3 th:text="${artwork.title}">title</h3>
      <p th:text="${artwork.description}">description</p>
    </a>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
