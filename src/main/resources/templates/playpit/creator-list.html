<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('クリエイター一覧')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Creators</p>
    <h1>参加クリエイター一覧</h1>
    <p>PLAYPITに参加するクリエイターのプロフィールと作品へ移動できます。</p>
  </section>
  <section class="creator-grid">
    <a class="creator-card" th:each="creator : ${creators}" th:href="@{/playpit/{eventId}/creators/{creatorId}(eventId=${eventId}, creatorId=${creator.slug})}">
      <img th:src="@{${creator.imageUrl}}" th:alt="${creator.name}">
      <div>
        <img class="avatar" th:src="@{${creator.iconImageUrl}}" alt="">
        <h3 th:text="${creator.name}">name</h3>
        <p>
          <span th:text="${creator.category}">category</span>
          <span th:if="${creator.artistName}" th:text="'@' + ${creator.artistName}">@artist</span>
        </p>
      </div>
    </a>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
