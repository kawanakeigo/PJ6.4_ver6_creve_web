<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('お知らせ')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">News</p>
    <h1>お知らせ</h1>
    <p>PLAYPITやCreVeに関する更新情報を掲載します。</p>
  </section>
  <section class="list-layout">
    <article class="event-row" th:each="item : ${news}">
      <span th:text="${#temporals.format(item.publishedAt, 'yyyy.MM.dd')}">2026.03.01</span>
      <strong th:text="${item.title}">title</strong>
      <em th:text="${item.body}">body</em>
    </article>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
