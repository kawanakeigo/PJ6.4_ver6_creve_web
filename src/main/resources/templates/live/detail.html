<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head(${event.name})}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Live Event</p>
    <h1 th:text="${event.name}">Live</h1>
    <p th:text="${event.subtitle}">subtitle</p>
  </section>
  <section class="featured-event">
    <img th:src="@{${event.mainImageUrl}}" th:alt="${event.name}">
    <div>
      <p class="eyebrow">Schedule</p>
      <h2 th:text="${event.scheduleText}">schedule</h2>
      <p th:text="${event.description}">description</p>
      <p th:text="${event.venueText}">venue</p>
    </div>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
