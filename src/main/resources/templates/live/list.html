<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('Live')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="page-title">
    <p class="eyebrow">Live</p>
    <h1>ライブイベント一覧</h1>
    <p>CreVeが扱うライブイベント情報を表示します。</p>
  </section>
  <section class="list-layout">
    <a class="event-row" th:each="event : ${events}" th:href="@{/live/{eventId}(eventId=${event.slug})}">
      <span th:text="${event.scheduleText}">2026年6月</span>
      <strong th:text="${event.name}">Live</strong>
      <em th:text="${event.summary}">summary</em>
    </a>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
