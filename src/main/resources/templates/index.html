<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('CreVe公式トップ')}"></head>
<body>
<div th:replace="~{common/header :: header(${active})}"></div>
<main>
  <section class="hero">
    <p class="eyebrow">Creative platform</p>
    <h1>CreVe</h1>
    <p class="lead">PLAYPIT、ライブ、LP、将来のVR空間をつなぐ、クリエイターと来場者のためのWeb基盤。</p>
    <div class="actions">
      <a class="button primary" th:href="@{/playpit}">PLAYPITを見る</a>
      <a class="button" th:href="@{/playpit/events}">イベント一覧</a>
    </div>
  </section>
  <section class="section-grid">
    <a class="panel" th:href="@{/playpit}" th:if="${!#lists.isEmpty(playpitEvents)}">
      <span>PLAYPIT</span>
      <strong th:text="${playpitEvents[0].name}">羽花展</strong>
      <p th:text="${playpitEvents[0].summary}">summary</p>
    </a>
    <a class="panel" th:href="@{/live}" th:if="${!#lists.isEmpty(liveEvents)}">
      <span>Live</span>
      <strong th:text="${liveEvents[0].name}">Live</strong>
      <p th:text="${liveEvents[0].summary}">summary</p>
    </a>
    <a class="panel" th:href="@{/news}" th:if="${!#lists.isEmpty(news)}">
      <span>News</span>
      <strong th:text="${news[0].title}">お知らせ</strong>
      <p th:text="${news[0].body}">news</p>
    </a>
  </section>
</main>
<div th:replace="~{common/footer :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
