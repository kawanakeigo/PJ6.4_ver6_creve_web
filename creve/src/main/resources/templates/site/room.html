<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:classappend="${room.theme=='DARK'}?'theme-dark' : ''"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${room.heading}+' | CreVe'">作者の部屋</title><link rel="stylesheet" th:href="@{/css/creve.css}"></head><body>
<header class="site-header"><a class="brand" th:href="@{/}">CreVe</a><nav><a th:href="@{/discover}">Creators</a><a th:href="@{/news}">News</a></nav></header>
<main><section class="room-hero"><div class="inner"><p class="eyebrow">CREATOR ROOM</p><h1 th:text="${room.heading}"></h1><p class="lead" th:text="${room.intro}"></p><p class="room-maker" th:text="${room.creatorName}"></p></div></section><section class="band"><div class="inner"><h2>作品</h2><div class="work-list"><article th:each="work:${room.works}"><p class="work-kind" th:text="${work.kind}"></p><h3 th:text="${work.title}"></h3><p th:text="${work.description}"></p><small th:text="${work.credit}"></small></article></div></div></section><section class="band creator-profile"><div class="inner split"><h2 th:text="${room.creatorName}"></h2><p th:text="${room.creatorProfile}"></p></div></section></main>
<footer><div class="inner footer-grid"><strong>CreVe</strong><a th:href="@{/discover}">部屋一覧へ</a><small>© CreVe</small></div></footer></body></html>
