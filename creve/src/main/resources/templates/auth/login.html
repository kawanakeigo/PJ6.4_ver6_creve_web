<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン | CreVe</title><link rel="stylesheet" th:href="@{/css/creve.css}"></head><body><header class="site-header"><a class="brand" th:href="@{/}">CreVe</a></header><main class="page inner auth-layout"><div><p class="eyebrow">ACCOUNT</p><h1>ログイン</h1><p>保存した部屋や、担当する作者の制作画面へ進みます。</p></div><form class="auth-form" method="post" th:action="@{/login}"><p class="error" th:if="${param.error}">メールアドレスまたはパスワードを確認してください。</p><label for="username">メールアドレス</label><input id="username" name="username" type="email" autocomplete="username" required><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button" type="submit">ログイン</button><p class="hint">ローカル確認: chaser@creve.local / creve-local-chaser</p></form></main></body></html>
