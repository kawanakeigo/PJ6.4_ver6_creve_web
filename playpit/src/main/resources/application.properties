spring.application.name=playpit
server.port=${PLAYPIT_PORT:8081}
server.servlet.session.cookie.name=PLAYPIT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

spring.datasource.url=${PLAYPIT_DATASOURCE_URL:jdbc:postgresql://localhost:55432/playpit}
spring.datasource.username=${PLAYPIT_DATASOURCE_USERNAME:playpit}
spring.datasource.password=${PLAYPIT_DATASOURCE_PASSWORD:playpit_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo
spring.flyway.enabled=true
spring.thymeleaf.cache=false

playpit.posting-enabled=${PLAYPIT_POSTING_ENABLED:true}
playpit.bootstrap-admin=${PLAYPIT_BOOTSTRAP_ADMIN:true}
playpit.admin.email=${PLAYPIT_ADMIN_EMAIL:admin@playpit.local}
playpit.admin.password=${PLAYPIT_ADMIN_PASSWORD:playpit-local-admin}
playpit.public-base-url=${PLAYPIT_PUBLIC_BASE_URL:http://localhost:8081}
playpit.subject-secret=${PLAYPIT_SUBJECT_SECRET:local-only-change-before-production}
playpit.media-root=${PLAYPIT_MEDIA_ROOT:./var/media}
playpit.demo-data=${PLAYPIT_DEMO_DATA:true}

# Compatibility keys used by the migrated PLAYPIT-owned infrastructure classes.
creve.posting-enabled=${PLAYPIT_POSTING_ENABLED:true}
creve.session.hash-salt=${PLAYPIT_SUBJECT_SECRET:local-only-change-before-production}
creve.public-base-url=${PLAYPIT_PUBLIC_BASE_URL:http://localhost:8081}
creve.site-url=${CREVE_PUBLIC_BASE_URL:http://localhost:8080}
creve.social-url=

logging.level.root=INFO
logging.level.world.creve=INFO
