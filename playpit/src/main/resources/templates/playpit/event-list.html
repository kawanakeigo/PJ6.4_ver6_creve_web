<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{common/head :: head('PLAYPITイベント一覧')}"></th:block>
<link rel="stylesheet" th:href="@{/playpit/css/playpit.css}"/>
</head>
<body>
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent">
<p class="eyebrow">PLAYPIT</p><h1 th:text="${archive} ? '過去のPLAYPIT' : 'イベント一覧'"></h1>
<section th:each="group : ${eventGroups}" th:if="${!#lists.isEmpty(group.value)}"><h2 th:text="${group.key}"></h2><div class="cards"><th:block th:each="e : ${group.value}"><article th:replace="~{playpit/fragments/cards :: eventCard(${e},'/playpit')}"></article></th:block></div></section><p th:if="${events.empty}">該当するイベントはありません。</p>
<nav aria-label="イベントのページ" class="pagination"><a th:href="@{${requestPath}(page=${events.number-1})}" th:if="${events.hasPrevious()}">前へ</a><span th:text="${events.number+1}"></span><a th:href="@{${requestPath}(page=${events.number+1})}" th:if="${events.hasNext()}">次へ</a></nav>
</main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
