<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('アクセス解析')}"></th:block>
 <link rel="stylesheet" th:href="@{/playpit/css/admin.css}">
</head>
<body >
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent"><h1>利用状況</h1><div th:replace="~{common/admin-nav :: adminNav}"></div><form method="get" th:action="@{/admin/metrics}"><label>イベントID<input type="number" name="eventId" min="1" required th:value="${eventId}"></label><button>表示</button></form><table><thead><tr><th>行動</th><th>回数</th></tr></thead><tbody><tr th:each="a:${analytics}"><td th:text="${a.kind}"></td><td th:text="${a.total}"></td></tr></tbody></table><section th:if="${summary != null}"><h2>集計</h2><p>イベント閲覧 <span th:text="${summary.event_views}"></span>／人物閲覧 <span th:text="${summary.creator_views}"></span>／作品閲覧 <span th:text="${summary.artwork_views}"></span>／感想受付 <span th:text="${summary.messages}"></span></p></section>
<h2>クリエイター別の投稿数</h2><table><thead><tr><th>クリエイター</th><th>削除を除く投稿</th><th>公開状態の投稿</th></tr></thead><tbody><tr th:each="c:${creatorTotals}"><td th:text="${c.name}"></td><td th:text="${c.total}"></td><td th:text="${c.published}"></td></tr></tbody></table><p>本文・表示名・セッションID・IPアドレスは解析データへ保存しません。</p></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
