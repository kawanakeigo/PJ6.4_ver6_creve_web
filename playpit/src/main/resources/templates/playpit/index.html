<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{common/head :: head('PLAYPIT')}"></th:block>
<link rel="stylesheet" th:href="@{/playpit/css/playpit.css}"/>
</head>
<body>
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent">
<section class="hero"><p class="eyebrow">ART, PEOPLE, WORDS</p><h1>PLAYPIT</h1><p class="lead">作品と人に出会い、感じたことを言葉として残す展示体験です。</p><a class="button" th:href="@{/playpit/events}">イベント一覧</a></section>
<div class="cards"><th:block th:each="e : ${events.content}"><article th:replace="~{playpit/fragments/cards :: eventCard(${e},'/playpit')}"></article></th:block></div><p th:if="${events.empty}">公開中のイベントはありません。</p>
</main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
