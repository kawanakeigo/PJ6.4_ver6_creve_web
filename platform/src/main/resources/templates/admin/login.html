<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('管理者ログイン')}"></th:block>
</head>
<body >
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent"><h1>管理者ログイン</h1><p class="error" th:if="${param.error}" role="alert">認証に失敗したか、一時的にログインが制限されています。</p><form method="post" th:action="@{/admin/login}" class="narrow"><label for="email">メールアドレス</label><input type="email" id="email" name="email" maxlength="254" autocomplete="username" required><label for="password">パスワード</label><input type="password" id="password" name="password" autocomplete="current-password" required><button>ログイン</button></form></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
