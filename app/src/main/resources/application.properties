spring.application.name=creve-workspace
server.port=${PORT:8080}
spring.datasource.url=${CREVE_DATASOURCE_URL:jdbc:postgresql://localhost:55432/creve_modular}
spring.datasource.username=${CREVE_DATASOURCE_USERNAME:creve}
spring.datasource.password=${CREVE_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
spring.thymeleaf.cache=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.springframework.security=INFO
creve.session.hash-salt=${CREVE_SESSION_HASH_SALT}
creve.base-url=${CREVE_BASE_URL:http://localhost:8080}
creve.posting-enabled=${CREVE_POSTING_ENABLED:false}
creve.bootstrap-admin=${CREVE_BOOTSTRAP_ADMIN:false}
creve.admin.email=${CREVE_ADMIN_EMAIL:}
creve.admin.password=${CREVE_ADMIN_PASSWORD:}
creve.login.max-failures=${CREVE_LOGIN_MAX_FAILURES:5}
creve.login.lock-minutes=${CREVE_LOGIN_LOCK_MINUTES:15}
creve.public-content-dir=${CREVE_PUBLIC_CONTENT_DIR:./config/public}
creve.social-url=${CREVE_SOCIAL_URL:}
