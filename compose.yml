name: creve-world-p0
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: platform_root
      POSTGRES_PASSWORD: platform_root_local
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${CREVE_DB_PORT:-55432}:5432"
    volumes:
      - creve_world_p0_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_root -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 40
    restart: unless-stopped
volumes:
  creve_world_p0_postgres:
