<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('NLJイベント一覧')}"></th:block>
 <link rel="stylesheet" th:href="@{/nlj/css/nlj.css}">
</head>
<body >
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent"><p class="eyebrow">NLJ</p><h1>ライブイベント一覧</h1><div class="cards"><article class="card" th:each="e:${events.content}"><img th:if="${e.mainImageUrl}" th:src="${e.mainImageUrl}" th:alt="${e.title}" loading="lazy"><h2><a th:href="@{/NLJ/{s}(s=${e.slug})}" th:text="${e.title}"></a></h2><p th:text="${e.phase}"></p><time th:text="${e.startAt}"></time><p th:text="${e.venueName}"></p><p th:text="${e.summary}"></p></article></div><p th:if="${events.empty}">公開中のNLJイベントはありません。</p><nav class="pagination"><a th:if="${events.hasPrevious()}" th:href="@{/NLJ(page=${events.number-1})}">前へ</a><a th:if="${events.hasNext()}" th:href="@{/NLJ(page=${events.number+1})}">次へ</a></nav></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
