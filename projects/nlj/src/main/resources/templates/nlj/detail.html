<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('NLJイベント詳細')}"></th:block>
 <link rel="stylesheet" th:href="@{/nlj/css/nlj.css}">
</head>
<body >
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent"><a th:href="@{/NLJ}">NLJイベント一覧</a><h1 th:text="${event.title}"></h1><img class="hero-image" th:if="${event.mainImageUrl}" th:src="${event.mainImageUrl}" th:alt="${event.title}"><time th:text="${event.startAt}"></time>〜<time th:text="${event.endAt}"></time><p th:text="${event.venueName}"></p><p th:text="${event.address}"></p><p class="preserve-lines" th:text="${event.description}"></p><h2>出演者</h2><article th:each="c:${creators}" class="card"><h3><a th:href="@{/creators/{c}(c=${c.slug})}" th:text="${c.name}"></a></h3><p th:text="${c.profile}"></p></article><p>料金：<span th:text="${event.price}"></span></p><a class="button" th:if="${event.ticketUrl}" th:href="${event.ticketUrl}" target="_blank" rel="noopener noreferrer">チケット・予約</a></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
