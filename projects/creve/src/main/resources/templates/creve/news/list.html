<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('お知らせ')}"></th:block>
 <link rel="stylesheet" th:href="@{/creve/css/creve.css}">
</head>
<body >
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent"><h1>お知らせ</h1><article th:each="n:${newsPage.content}" class="card"><time th:text="${n.publishedAt}"></time><h2 th:text="${n.title}"></h2><p class="preserve-lines" th:text="${n.body}"></p></article><p th:if="${newsPage.empty}">お知らせはありません。</p><nav class="pagination"><a th:if="${newsPage.hasPrevious()}" th:href="@{/news(page=${newsPage.number-1})}">前へ</a><a th:if="${newsPage.hasNext()}" th:href="@{/news(page=${newsPage.number+1})}">次へ</a></nav></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
