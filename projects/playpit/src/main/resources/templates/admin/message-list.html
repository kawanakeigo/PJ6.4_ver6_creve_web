<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('投稿管理')}"></th:block>
</head>
<body >
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent"><h1>投稿管理</h1><div th:replace="~{common/admin-nav :: adminNav}"></div>
<form method="get" th:action="@{/admin/messages}" class="filter-grid"><label>イベントID<input name="eventId" type="number" min="1" th:value="${param.eventId}"></label><label>クリエイターID<input name="creatorId" type="number" min="1" th:value="${param.creatorId}"></label><label>作品ID<input name="artworkId" type="number" min="1" th:value="${param.artworkId}"></label><label>公開状態<select name="status"><option value="">すべて</option><option th:each="s:${T(world.creve.playpit.entity.MessageStatus).values()}" th:value="${s}" th:text="${s}" th:selected="${param.status != null and param.status[0] == s.name()}"></option></select></label><label>投稿日<input type="date" name="date" th:value="${param.date}"></label><label>キーワード<input name="keyword" maxlength="300" th:value="${param.keyword}"></label><button>検索</button></form>
<article class="card" th:each="m:${messages.content}"><p th:text="'投稿ID：'+${m.messageId}+' / イベントID：'+${m.eventId}+' / クリエイターID：'+${m.creatorId}+' / 作品ID：'+${m.artworkId}"></p><time th:text="${m.createdAt}"></time><p class="preserve-lines" th:text="${m.message}"></p><p th:text="${m.anonymous} ? '匿名' : ${m.displayName}"></p><p th:text="${m.status}"></p><form method="post" th:action="@{/admin/messages/{id}/status(id=${m.messageId})}"><select name="status"><option value="PUBLISHED">公開</option><option value="HIDDEN">非公開</option><option value="PENDING">審査待ち</option></select><button>変更</button></form><form method="post" th:action="@{/admin/messages/{id}/delete(id=${m.messageId})}" data-confirm="この投稿を論理削除しますか？"><button>論理削除</button></form></article>
<nav class="pagination"><a th:if="${messages.hasPrevious()}" th:href="@{/admin/messages(page=${messages.number-1},eventId=${param.eventId},creatorId=${param.creatorId},artworkId=${param.artworkId},status=${param.status},date=${param.date},keyword=${param.keyword})}">前へ</a><span th:text="${messages.number+1}"></span><a th:if="${messages.hasNext()}" th:href="@{/admin/messages(page=${messages.number+1},eventId=${param.eventId},creatorId=${param.creatorId},artworkId=${param.artworkId},status=${param.status},date=${param.date},keyword=${param.keyword})}">次へ</a></nav>
</main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
