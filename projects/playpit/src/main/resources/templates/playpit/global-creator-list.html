<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('クリエイター一覧')}"></th:block>
 <link rel="stylesheet" th:href="@{/playpit/css/playpit.css}">
 <link rel="stylesheet" th:href="@{/playpit/css/creator.css}">
</head>
<body>
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent">
 <p class="eyebrow">CreVe Creators</p>
 <h1>クリエイター一覧</h1>
 <div class="cards">
  <article class="card creator-card" th:each="creator : ${creators.content}">
   <img th:if="${creator.profileImageUrl}" th:src="${creator.profileImageUrl}" th:alt="${creator.name}" loading="lazy" width="320" height="320">
   <h2><a th:href="@{/creators/{creatorId}(creatorId=${creator.slug})}" th:text="${creator.name}"></a></h2>
   <p th:text="${creator.genre}"></p>
   <p class="preserve-lines" th:text="${creator.profile}"></p>
   <p th:text="'公開作品：' + ${creator.artworkCount} + '点'"></p>
  </article>
 </div>
 <p th:if="${creators.empty}">公開中のクリエイターはいません。</p>
 <nav aria-label="クリエイター一覧のページ" class="pagination">
  <a th:if="${creators.hasPrevious()}" th:href="@{/creators(page=${creators.number-1})}">前へ</a>
  <span th:text="${creators.number+1}"></span>
  <a th:if="${creators.hasNext()}" th:href="@{/creators(page=${creators.number+1})}">次へ</a>
 </nav>
</main>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
