<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{playpit/fragments/head :: head('クリエイター一覧')}"></th:block>
 <link rel="stylesheet" th:href="@{/playpit/css/playpit.css}">
 <link rel="stylesheet" th:href="@{/playpit/css/creator.css}">
</head>
<body class="playpit-public">
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/navigation :: headerFor(true)}"></div>
<main id="mainContent">
 <p class="eyebrow">PLAYPIT / ARTISTS</p>
 <h1 class="editorial-page-title">Artists <small>クリエイター一覧</small></h1>
 <div class="creator-directory">
  <article class="creator-directory-item" th:each="creator : ${creators.content}">
   <a class="creator-profile-link" th:href="@{/creators/{creatorId}(creatorId=${creator.slug})}">
    <span class="creator-avatar"><img th:if="${!#strings.isEmpty(creator.profileImageUrl)}" th:src="${creator.profileImageUrl}" alt="" loading="lazy" width="160" height="160"><span th:if="${#strings.isEmpty(creator.profileImageUrl)}" class="avatar-placeholder" aria-hidden="true">P</span></span>
    <h2 th:text="${creator.name}"></h2>
   </a>
   <p th:if="${!#strings.isEmpty(creator.genre)}" th:text="${creator.genre}"></p>
  </article>
 </div>
 <p th:if="${creators.empty}">公開中のクリエイターはいません。</p>
 <nav aria-label="クリエイター一覧のページ" class="pagination">
  <a th:if="${creators.hasPrevious()}" th:href="@{/creators(page=${creators.number-1})}">前へ</a>
  <span th:text="${creators.number+1}"></span>
  <a th:if="${creators.hasNext()}" th:href="@{/creators(page=${creators.number+1})}">次へ</a>
 </nav>
</main>
<div th:replace="~{common/navigation :: footerFor(true)}"></div>
</body>
</html>
