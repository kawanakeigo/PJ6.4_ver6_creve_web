<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:replace="~{playpit/fragments/head :: head('PLAYPITイベント詳細')}"></th:block>
<link rel="stylesheet" th:href="@{/playpit/css/playpit.css}"/>
</head>
<body class="playpit-public exhibition-public">
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/navigation :: headerFor(true)}"></div>
<main id="mainContent">
<a th:href="@{/playpit/events}">イベント一覧</a>
<div th:replace="~{playpit/fragments/event-presentation :: hero}"></div>
<div th:replace="~{playpit/fragments/event-presentation :: theme}"></div>
<section class="editorial-section"><div class="editorial-heading"><h2>Artists <small>参加クリエイター</small></h2></div><p th:unless="${#lists.isEmpty(creators)}" class="editorial-note">掲載中のクリエイターをご紹介しています。参加者全員の一覧ではない場合があります。</p><div class="cards"><th:block th:each="c : ${creators}"><article th:replace="~{playpit/fragments/cards :: creatorCard(${c})}"></article></th:block></div><p th:if="${#lists.isEmpty(creators)}">参加クリエイターの紹介は公開準備中です。</p><a class="editorial-action" th:href="@{/playpit/{e}/creators(e=${event.slug})}">クリエイター一覧 <span aria-hidden="true">↗</span></a></section>
<section class="editorial-section"><div class="editorial-heading"><h2>Works <small>展示作品</small></h2></div><div class="cards"><th:block th:each="a : ${artworks}"><article th:replace="~{playpit/fragments/cards :: artworkCard(${a})}"></article></th:block></div><p th:if="${#lists.isEmpty(artworks)}">展示作品は公開準備中です。</p><a class="editorial-action" th:href="@{/playpit/{e}/artworks(e=${event.slug})}">作品一覧 <span aria-hidden="true">↗</span></a></section>
<section class="exhibition-information"><div><p class="eyebrow">INFORMATION</p><h2>開催概要</h2><div th:replace="~{playpit/fragments/event-presentation :: facts}"></div></div></section>
</main><div th:replace="~{common/navigation :: footerFor(true)}"></div></body></html>
