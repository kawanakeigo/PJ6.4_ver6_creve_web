<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('作品編集')}"></th:block>
 <link rel="stylesheet" th:href="@{/playpit/css/admin.css}">
 <script defer th:src="@{/playpit/js/admin.js}"></script>
</head>
<body >
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent"><h1>作品の登録・編集</h1><div th:replace="~{common/admin-nav :: adminNav}"></div><p class="notice" th:if="${param.saved}">保存しました。</p><form method="post" enctype="multipart/form-data" th:object="${form}" th:action="@{${formAction}}" class="editor-form"><div class="error" th:if="${#fields.hasAnyErrors()}"><p th:each="err:${#fields.allErrors()}" th:text="${err}"></p><p>ブラウザは送信後の画像選択を復元できないため、画像を追加する場合はもう一度選択してください。</p></div><th:block th:if="${fixedCreator != null}"><p>制作者：<strong th:text="${fixedCreator.name}"></strong>（ID <span th:text="${fixedCreator.creatorId}"></span>）</p><input th:field="*{creatorId}" type="hidden"><a th:href="@{/admin/creators/{id}/edit(id=${fixedCreator.creatorId})} + '#creatorWorks'">この人の作品一覧へ</a></th:block><th:block th:if="${fixedCreator == null}"><label for="creatorId">制作者ID（必須）</label><input id="creatorId" th:field="*{creatorId}" type="number" required><p>人物の編集画面から追加すると制作者が固定されます。</p></th:block><p th:if="${id == null}">作品のURLは保存時に自動で作成されます。</p><details th:if="${id != null}"><summary>作品のURL識別子</summary><p th:text="*{slug}"></p><p>作品名を変更してもURLは変わりません。</p></details><label for="title">名称（必須）</label><input id="title" th:field="*{title}" type="text" maxlength="150" required><label for="description">説明</label><textarea id="description" th:field="*{description}" maxlength="20000" rows="5"></textarea><label for="background">制作背景</label><textarea id="background" th:field="*{background}" maxlength="20000" rows="5"></textarea><label for="concept">制作テーマ・制作意図</label><textarea id="concept" th:field="*{concept}" maxlength="20000" rows="5"></textarea><label for="materials">素材・技法</label><input id="materials" th:field="*{materials}" type="text" maxlength="300"><label for="productionYear">制作年</label><input id="productionYear" th:field="*{productionYear}" type="number"><label for="artworkImage">作品画像</label><input id="artworkImage" name="artworkImage" type="file" accept="image/jpeg,image/png" data-image-upload><p>JPEG・PNG、1枚10MB以下、幅・高さ各4096px以下。選択しない場合は現在の画像を保持します。</p><img class="admin-image-preview" th:if="${!#strings.isEmpty(form.mainImageUrl)}" th:src="*{mainImageUrl}" alt="現在の作品画像"><details><summary>既存の画像URLを使う</summary><label for="mainImageUrl">メイン画像URL</label><input id="mainImageUrl" th:field="*{mainImageUrl}" type="text" maxlength="500"></details><label for="status">公開状態（必須）</label><select id="status" th:field="*{status}"><option value="DRAFT">下書き</option><option value="PUBLISHED">公開</option><option value="HIDDEN">非公開</option><option value="ARCHIVED">アーカイブ</option></select><label for="mediaLines">追加メディア（1行に IMAGE/VIDEO/AUDIO|URL|説明）</label><textarea id="mediaLines" th:field="*{mediaLines}" maxlength="20000" rows="5"></textarea><button>保存する</button></form></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
