<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('通報管理')}"></th:block>
 <link rel="stylesheet" th:href="@{/playpit/css/admin.css}">
</head>
<body >
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent"><h1>通報管理</h1><div th:replace="~{common/admin-nav :: adminNav}"></div><article class="card" th:each="r:${reports}"><p th:text="'投稿ID：'+${r.message_id}+' / 状態：'+${r.status}"></p><h2>通報理由</h2><p class="preserve-lines" th:text="${r.reason}"></p><h2>対象の投稿</h2><p class="preserve-lines" th:text="${r.message}"></p><form method="post" th:action="@{/admin/reports/{id}/review(id=${r.report_id})}"><button>確認済みにする</button></form><a th:href="@{/admin/messages}">投稿管理で公開状態を変更する</a></article><nav class="pagination"><a th:if="${page>0}" th:href="@{/admin/reports(page=${page-1})}">前へ</a><a th:if="${#lists.size(reports)==30}" th:href="@{/admin/reports(page=${page+1})}">次へ</a></nav></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
