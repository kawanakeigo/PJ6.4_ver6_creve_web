<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('イベント管理')}"></th:block>
 <link rel="stylesheet" th:href="@{/playpit/css/admin.css}">
 <script defer th:src="@{/playpit/js/admin.js}"></script>
</head>
<body >
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent"><h1>イベント管理</h1><div th:replace="~{common/admin-nav :: adminNav}"></div><a class="button" th:href="@{/admin/events/new}">新規登録</a><div class="table-scroll"><table><thead><tr><th>ID</th><th>名称</th><th>識別子</th><th>公開状態</th><th>操作</th></tr></thead><tbody><tr th:each="e:${items.content}"><td th:text="${e.eventId}"></td><td th:text="${e.title}"></td><td th:text="${e.slug}"></td><td th:text="${e.status}"></td><td><a th:href="@{/admin/events/{id}/edit(id=${e.eventId})}">編集</a></td></tr></tbody></table></div><nav class="pagination"><a th:if="${items.hasPrevious()}" th:href="@{/admin/events(page=${items.number-1})}">前へ</a><a th:if="${items.hasNext()}" th:href="@{/admin/events(page=${items.number+1})}">次へ</a></nav></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
