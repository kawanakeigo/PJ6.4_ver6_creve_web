<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('イベント編集')}"></th:block>
 <link rel="stylesheet" th:href="@{/playpit/css/admin.css}">
 <script defer th:src="@{/playpit/js/admin.js}"></script>
</head>
<body >
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent"><h1>イベントの登録・編集</h1><div th:replace="~{common/admin-nav :: adminNav}"></div><p class="notice" th:if="${param.saved}">保存しました。</p><form method="post" th:object="${form}" th:action="${id == null} ? @{/admin/events} : @{/admin/events/{id}(id=${id})}" class="editor-form"><div class="error" th:if="${#fields.hasAnyErrors()}"><p th:each="err:${#fields.allErrors()}" th:text="${err}"></p></div><label for="eventType">イベント種別（必須）</label><input id="eventType" th:field="*{eventType}" type="text" required><label for="slug">URL識別子（半角英小文字・数字・ハイフン）（必須）</label><input id="slug" th:field="*{slug}" type="text" maxlength="100" required><label for="title">名称（必須）</label><input id="title" th:field="*{title}" type="text" maxlength="150" required><label for="summary">短い説明</label><input id="summary" th:field="*{summary}" type="text" maxlength="300"><label for="description">説明</label><textarea id="description" th:field="*{description}" maxlength="20000" rows="5"></textarea><label for="mainImageUrl">メイン画像URL</label><input id="mainImageUrl" th:field="*{mainImageUrl}" type="text" maxlength="500"><label for="startAt">開始日時（必須）</label><input id="startAt" th:field="*{startAt}" type="datetime-local" required><label for="endAt">終了日時（必須）</label><input id="endAt" th:field="*{endAt}" type="datetime-local" required><label for="venueName">会場名</label><input id="venueName" th:field="*{venueName}" type="text" maxlength="150"><label for="address">住所</label><input id="address" th:field="*{address}" type="text" maxlength="300"><label for="access">アクセス</label><textarea id="access" th:field="*{access}" maxlength="20000" rows="5"></textarea><label for="price">料金</label><input id="price" th:field="*{price}" type="text" maxlength="100"><label for="ticketUrl">チケット・予約URL</label><input id="ticketUrl" th:field="*{ticketUrl}" type="text" maxlength="500"><label for="status">公開状態（必須）</label><select id="status" th:field="*{status}"><option value="DRAFT">下書き</option><option value="PUBLISHED">公開</option><option value="HIDDEN">非公開</option><option value="ARCHIVED">アーカイブ</option></select><button>保存する</button></form><section th:if="${id != null}"><h2>参加クリエイターの関連付け</h2><p>先にクリエイターを登録し、IDを指定してください。同じ組合せは表示順・展示名を更新します。</p><ul><li th:each="p:${participants}" th:text="'クリエイターID '+${p.creatorId}+' / 表示順 '+${p.displayOrder}"></li></ul><form method="post" th:action="@{/admin/events/{id}/participants(id=${id})}"><label>クリエイターID<input type="number" name="creatorId" min="1" required></label><label>表示順<input type="number" name="displayOrder" value="0" required></label><label>展示名<input name="exhibitionTitle" maxlength="150"></label><button>参加を登録・更新</button></form>
<h2>出展作品の関連付け</h2><p>制作者をイベントに参加登録した後、作品IDを指定してください。</p><ul><li th:each="e:${exhibitions}"><span th:text="'作品ID '+${e.artworkId}+' / 表示順 '+${e.displayOrder}"></span><a th:if="${e.qrCodeUrl}" th:href="${e.qrCodeUrl}" target="_blank" rel="noopener">QRコード（公開中のみ）</a></li></ul><form method="post" th:action="@{/admin/events/{id}/exhibitions(id=${id})}"><label>作品ID<input type="number" name="artworkId" min="1" required></label><label>表示順<input type="number" name="displayOrder" value="0" required></label><label>展示場所<input name="exhibitionArea" maxlength="150"></label><button>展示を登録・更新</button></form></section></main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
