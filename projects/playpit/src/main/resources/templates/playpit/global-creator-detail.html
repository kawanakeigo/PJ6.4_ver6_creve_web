<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{playpit/fragments/head :: head('クリエイター')}"></th:block>
 <link rel="stylesheet" th:href="@{/playpit/css/playpit.css}">
 <link rel="stylesheet" th:href="@{/playpit/css/creator.css}">
 <link rel="stylesheet" th:href="@{/playpit/css/artwork.css}">
 <script defer th:src="@{/playpit/js/words.js}"></script>
 <script defer th:src="@{/playpit/js/message.js}"></script>
 <script defer th:src="@{/playpit/js/analytics.js}"></script>
</head>
<body class="playpit-public" th:attr="data-event-id=${selectedEvent == null ? null : selectedEvent.eventId},data-creator-id=${creatorId},data-artwork-id=${artworkId}">
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/navigation :: headerFor(true)}"></div>
<main id="mainContent">
 <a th:href="@{/creators}">クリエイター一覧</a>
 <p class="eyebrow">ARTIST / クリエイター</p>
 <section class="creator-opening" id="selectedWorks" aria-label="公開作品" th:if="${!#lists.isEmpty(openingWorks)}">
  <article class="opening-work" th:each="artwork : ${openingWorks}">
   <img th:if="${artwork.mainImageUrl}" th:src="${artwork.mainImageUrl}" th:alt="${artwork.title}">
   <h2><a th:if="${selectedEvent != null}" th:href="@{/playpit/{e}/artworks/{a}(e=${selectedEvent.slug},a=${artwork.slug})}" th:text="${artwork.title}"></a><span th:if="${selectedEvent == null}" th:text="${artwork.title}"></span></h2>
  </article>
 </section>
 <section class="creator-about" id="about" aria-labelledby="creatorName">
  <div class="creator-icon" th:if="${!#strings.isEmpty(creator.profileImageUrl)}">
   <img th:src="${creator.profileImageUrl}" th:alt="${creator.name} + 'のアイコン'">
  </div>
  <div class="creator-icon" th:if="${#strings.isEmpty(creator.profileImageUrl)}" aria-label="アイコン未登録"><span class="avatar-placeholder" aria-hidden="true">P</span></div>
  <p class="eyebrow" th:if="${!#strings.isEmpty(creator.genre)}" th:text="${creator.genre}"></p>
  <h1 id="creatorName" th:text="${creator.name}"></h1>
  <div class="creator-introduction">
   <p th:if="${#strings.isEmpty(creator.profile)}">紹介文は準備中です。</p>
   <p class="preserve-lines" th:if="${!#strings.isEmpty(creator.profile)}" th:text="${creator.profile}"></p>
   <div class="creator-concept" th:if="${!#strings.isEmpty(creator.concept)}"><h2>制作で大切にしていること</h2><p class="preserve-lines" th:text="${creator.concept}"></p></div>
  </div>
  <nav class="creator-links" aria-label="クリエイターの外部リンク">
   <a data-sns-link rel="noopener noreferrer" target="_blank" th:each="link : ${creator.snsLinks}" th:href="${link.url}" th:text="${link.label}"></a>
   <a data-sns-link rel="noopener noreferrer" target="_blank" th:if="${creator.websiteUrl}" th:href="${creator.websiteUrl}">Webサイト</a>
  </nav>
  <a class="creator-scroll" href="#works">作品一覧へ <span aria-hidden="true">↓</span></a>
 </section>

 <section th:if="${!#lists.isEmpty(playpitEvents)}" class="event-context">
  <h2>作品・感想の対象イベント</h2>
  <nav aria-label="展示内容を表示するPLAYPITイベント">
   <a th:each="participation : ${playpitEvents}" th:href="@{/creators/{creatorId}(creatorId=${creator.slug},event=${participation.slug})}" th:text="${participation.title}" th:classappend="${selectedEvent != null and participation.eventId == selectedEvent.eventId} ? 'active' : ''"></a>
  </nav>
 </section>
 <section class="creator-works" id="works">
  <p class="eyebrow">WORKS</p><h2 th:text="${selectedEvent == null ? '作品' : selectedEvent.title + 'の出展作品'}">作品</h2>
  <div class="cards">
   <article class="card artwork-card" th:each="artwork : ${artworks}">
    <img th:if="${artwork.mainImageUrl}" th:src="${artwork.mainImageUrl}" th:alt="${artwork.title}" loading="lazy" width="500" height="400">
    <h3><a th:if="${selectedEvent != null}" th:href="@{/playpit/{e}/artworks/{a}(e=${selectedEvent.slug},a=${artwork.slug})}" th:text="${artwork.title}"></a><span th:if="${selectedEvent == null}" th:text="${artwork.title}"></span></h3>
   </article>
  </div>
  <p th:if="${#lists.isEmpty(artworks)}">公開中の作品はありません。</p>
  <nav aria-label="作品一覧のページ" class="pagination">
   <a th:if="${artworkPage > 0}" th:href="@{/creators/{creatorId}(creatorId=${creator.slug},event=${selectedEventSlug},artworkPage=${artworkPage-1})}">前の作品</a>
   <a th:if="${#lists.size(artworks) == 30}" th:href="@{/creators/{creatorId}(creatorId=${creator.slug},event=${selectedEventSlug},artworkPage=${artworkPage+1})}">次の作品</a>
  </nav>
 </section>

 <section>
  <h2>参加イベント</h2>
  <ul class="participation-list">
   <li th:each="participation : ${events}">
    <a th:if="${participation.eventType == 'PLAYPIT'}" th:href="@{/playpit/{eventId}(eventId=${participation.slug})}" th:text="${participation.title}"></a>
    <a th:if="${participation.eventType == 'NLJ'}" th:href="@{/NLJ/{eventId}(eventId=${participation.slug})}" th:text="${participation.title}"></a>
    <span th:if="${participation.eventType != 'PLAYPIT' and participation.eventType != 'NLJ'}" th:text="${participation.title}"></span>
    <span th:text="' / ' + ${participation.eventType}"></span>
   </li>
  </ul>
  <p th:if="${#lists.isEmpty(events)}">公開中の参加イベントはありません。</p>
 </section>



 <th:block th:if="${selectedEvent != null}">
  <div th:replace="~{playpit/fragments/message-form :: messageForm}"></div>

  <div th:replace="~{playpit/fragments/words :: words}"></div>
 </th:block>
 <p class="notice" th:if="${selectedEvent == null}">感想投稿は、参加中のPLAYPITイベントが公開されると表示されます。</p>

 <details>
  <summary>プロフィール共有用QRコード</summary>
  <img class="qr-code" th:src="@{/creators/{creatorId}/qr.png(creatorId=${creator.slug})}" alt="このクリエイターのページへのQRコード" loading="lazy" width="256" height="256">
 </details>
</main>
<div th:replace="~{common/navigation :: footerFor(true)}"></div>
</body>
</html>
