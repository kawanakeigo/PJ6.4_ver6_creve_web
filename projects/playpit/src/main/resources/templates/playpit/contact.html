<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{playpit/fragments/head :: head('PLAYPITへのお問い合わせ')}"></th:block><link rel="stylesheet" th:href="@{/playpit/css/playpit.css}"></head>
<body class="playpit-public"><a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/navigation :: headerFor(true)}"></div>
<main id="mainContent"><p class="eyebrow">PLAYPIT</p><h1 class="editorial-page-title">Contact <small>お問い合わせ</small></h1>
<p class="lead">PLAYPITの展示・活動に関するお問い合わせをご案内します。</p>
<section class="contact-action"><h2>一般のお問い合わせ</h2><p th:if="${contactFormUrl != null}">Googleフォームでお問い合わせを受け付けています。次のリンクからGoogleのサイトへ移動します。</p><a th:if="${contactFormUrl != null}" class="editorial-action" th:href="${contactFormUrl}" target="_blank" rel="noopener noreferrer">お問い合わせフォームを開く ↗</a><p th:if="${contactFormUrl == null}">お問い合わせフォームは準備中です。受付開始後にこちらでご案内します。</p></section>
<section class="panel" th:if="${contactContent != null}"><h2>お問い合わせ先</h2><p class="preserve-lines" th:if="${contactContent != null}" th:text="${contactContent}"></p></section>
<a th:href="@{/playpit}">PLAYPITトップへ</a></main>
<div th:replace="~{common/navigation :: footerFor(true)}"></div></body></html>
