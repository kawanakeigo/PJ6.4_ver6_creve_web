<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
 <th:block th:replace="~{common/head :: head('羽花')}"></th:block>
 <link rel="stylesheet" th:href="@{/playpit/css/playpit.css}">
 <link rel="stylesheet" th:href="@{/playpit/css/uka.css}">
 <script defer th:src="@{/playpit/js/uka.js}"></script>
 <script defer th:src="@{/playpit/js/analytics.js}"></script>
</head>
<body th:attr="data-event-id=${event.eventId},data-creator-id=${creatorId},data-artwork-id=${artworkId}">
<a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/header :: header}"></div>
<main id="mainContent">
<a th:href="@{/playpit/{e}(e=${event.slug})}" th:text="${event.title}"></a><h1>言葉で育つ、羽花</h1>
<div th:replace="~{playpit/fragments/uka :: ukaBoard}"></div>
<section><h2>クリエイターごとに届いた言葉</h2><ul class="creator-counts"><li th:each="c : ${creatorCounts}"><a th:href="@{/playpit/{e}/creators/{c}(e=${event.slug},c=${c.creatorSlug})}" th:text="${c.creatorName}"></a>：<span th:text="${c.messageCount}"></span>件 <a th:href="@{/playpit/{e}/uka(e=${event.slug},creatorId=${c.creatorId})}">言葉で絞り込む</a></li></ul></section>
<div th:replace="~{playpit/fragments/words :: words}"></div>
</main>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
