<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{playpit/fragments/head :: head('PLAYPITのお知らせ')}"></th:block><link rel="stylesheet" th:href="@{/playpit/css/playpit.css}"></head>
<body class="playpit-public"><a class="skip-link" href="#mainContent">本文へ移動</a>
<div th:replace="~{common/navigation :: headerFor(true)}"></div>
<main id="mainContent"><p class="eyebrow">PLAYPIT</p><h1 class="editorial-page-title">News <small>PLAYPITのお知らせ</small></h1>
<p class="lead">PLAYPITの展示や活動に関するお知らせをお届けします。</p>
<section aria-label="活動のお知らせ"><article class="news-entry" th:each="notice : ${notices}"><time th:datetime="${notice.date}" th:text="${notice.date}"></time><h2 th:text="${notice.title}"></h2><p class="preserve-lines" th:text="${notice.body}"></p></article></section>
<h2>イベント開催のお知らせ</h2>
<div class="cards"><th:block th:each="e : ${events.content}"><article th:replace="~{playpit/fragments/cards :: eventCard(${e},'/playpit')}"></article></th:block></div>
<p th:if="${events.empty}">現在、公開中のお知らせはありません。</p>
<nav class="pagination" aria-label="お知らせのページ"><a th:if="${events.hasPrevious()}" th:href="@{/playpit/news(page=${events.number-1})}">前へ</a><a th:if="${events.hasNext()}" th:href="@{/playpit/news(page=${events.number+1})}">次へ</a></nav>
<a th:href="@{/playpit}">PLAYPITトップへ</a></main>
<div th:replace="~{common/navigation :: footerFor(true)}"></div></body></html>
