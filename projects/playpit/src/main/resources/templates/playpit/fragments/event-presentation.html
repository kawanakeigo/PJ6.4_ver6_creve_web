<div xmlns:th="http://www.thymeleaf.org">
<section th:fragment="hero" class="exhibition-hero" th:classappend="${#strings.isEmpty(event.mainImageUrl)} ? 'exhibition-hero-text'">
 <div><p class="eyebrow" th:text="${event.phase} + ' / EXHIBITION'"></p><h1 th:text="${event.title}"></h1><p class="exhibition-tagline" th:if="${event.slug == 'beforeafter-2026'}">これまでと、これからを。<br>作品を通じて、届ける。</p><a class="editorial-action" href="#theme">展示のテーマへ <span aria-hidden="true">↓</span></a></div>
 <img th:if="${event.mainImageUrl}" th:src="${event.mainImageUrl}" th:alt="${event.title} + 'の展示ビジュアル'">
</section>
<section th:fragment="theme" class="exhibition-theme" id="theme" aria-labelledby="themeTitle"><p class="eyebrow" id="themeTitle">EXHIBITION THEME</p><p class="preserve-lines" th:if="${!#strings.isEmpty(event.summary)}" th:text="${event.summary}"></p><p th:if="${#strings.isEmpty(event.summary)}">展示のテーマは公開準備中です。</p></section>
<dl th:fragment="facts" class="event-facts"><dt>会期</dt><dd><time th:text="${#temporals.format(event.startAt, event.startAt.hour == 0 and event.startAt.minute == 0 ? 'yyyy/MM/dd' : 'yyyy/MM/dd HH:mm')}"></time> 〜 <time th:text="${#temporals.format(event.endAt, event.endAt.hour == 0 and event.endAt.minute == 0 ? 'yyyy/MM/dd' : 'yyyy/MM/dd HH:mm')}"></time></dd><dt>会場</dt><dd th:text="${event.venueName}"></dd><dt th:if="${!#strings.isEmpty(event.address)}">住所</dt><dd th:if="${!#strings.isEmpty(event.address)}" th:text="${event.address}"></dd><dt th:if="${!#strings.isEmpty(event.access)}">アクセス</dt><dd th:if="${!#strings.isEmpty(event.access)}" class="preserve-lines" th:text="${event.access}"></dd></dl>
<section th:fragment="film" class="editorial-section exhibition-film" aria-labelledby="filmTitle"><div class="editorial-heading"><h2 id="filmTitle">Inside PLAYPIT <small>展示の風景</small></h2></div><p>作品と人が出会う、展示会のひととき。</p><div class="exhibition-player" data-exhibition-player><button type="button" data-load-exhibition-video><span class="film-play" aria-hidden="true">▷</span><span>展示会紹介の動画を表示</span><small>クリックするとYouTubeに接続します。再生はプレーヤー内で開始してください。</small></button></div><p class="editorial-note"><a href="https://youtu.be/RuZj3S_MjQo" target="_blank" rel="noopener noreferrer">YouTubeで見る ↗</a></p></section>
</div>
